[tox]
envlist =
    py{py,39,310,311,312,313,314,315}

minversion = 3.9
isolated_build = true

[gh-actions]
python =
    3.9: py39
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314
    3.15: py315

[testenv]
setenv =
    PYTHONPATH = {toxinidir}
deps =
    pytest
    pytest-cov
    tox
    click
commands =
    pytest --basetemp={envtmpdir}
